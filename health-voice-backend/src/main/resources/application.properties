server.port=8080
spring.application.name=health-voice-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:health_voice_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# FPT.AI Cloud Text to Speech
fpt.ai.api-url=https://api.fpt.ai/hmi/tts/v5
fpt.ai.api-key=${FPT_AI_KEY:QT2SnOFWi3P4pekGKV1TkuzQAKJUcNgZ}
storage.upload-dir=./uploads/audios

# App JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.storage.audio-dir=${AUDIO_STORAGE_PATH:./uploads/audios}

# Python FastAPI TTS Microservice
tts.service.url=${TTS_SERVICE_URL:http://localhost:8000}

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Google Gemini LLM API Configuration
gemini.api-key=${GEMINI_API_KEY:AIzaSyC8g92p4WOnNvLKUwymnytfxct5SWrSht8}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
gemini.fallback-url=${GEMINI_FALLBACK_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}




